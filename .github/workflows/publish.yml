name: Publish to npm

# Publishes the JumpingJobs CLI/package to npm.
# Triggers:
#   - When you publish a GitHub Release (the normal path).
#   - Manual run via the Actions tab (workflow_dispatch).
#
# Prerequisites (one-time):
#   1. An npm "Automation" access token saved as the repo secret NPM_TOKEN.
#   2. The package name in package.json must be available on npm (or scoped, e.g.
#      @your-scope/jumpingjobs with "publishConfig.access": "public").
#   3. Bump "version" in package.json before each release (npm rejects a duplicate version).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # No runtime dependencies; prepublishOnly regenerates the per-harness output,
      # so a plain publish is enough. (npm ci is skipped because there is no lockfile.)
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
