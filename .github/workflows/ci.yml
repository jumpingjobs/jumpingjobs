name: CI

# Runs on every push and pull request:
#   1. Validates manifests + skill frontmatter (npm run check).
#   2. Rebuilds the per-harness output from source/ and fails if it differs from what is
#      committed (drift guard) -- so the generated trees can never fall out of sync with source.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifests and skills
        run: npm run check

      - name: Rebuild from source and check for drift
        run: |
          npm run build
          if ! git diff --quiet; then
            echo "::error::Generated harness output is out of sync with source/. Run 'npm run build' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "Generated output matches source."
