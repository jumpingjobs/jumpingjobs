name: CI

# Runs on every push and pull request:
#   1. Validates the committed source on its own (manifests, versions, skill frontmatter).
#   2. Builds every harness tree from source/ and re-validates, so a source change that
#      cannot be generated for some harness fails here rather than at publish time.
#
# Generated trees are not committed, so there is no drift to guard against -- the build is
# run from scratch on every CI run and again by `prepublishOnly` when publishing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate committed source
        run: npm run check -- --source-only

      - name: Build all harness trees
        run: npm run build

      - name: Validate generated output
        run: npm run check

      - name: Verify the npm tarball ships every harness
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          for dir in .claude .cursor .github .gemini .codex .opencode .kiro .agents; do
            if ! grep -q "\"$dir/skills/" /tmp/pack.json; then
              echo "::error::$dir/skills is missing from the npm tarball"
              exit 1
            fi
          done
          echo "All 8 harness trees present in the tarball."
